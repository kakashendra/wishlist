<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вишлист</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--fs-s:12px;--fs-b:8px;--fs-n:12px;--g1:#5ba03a;--g2:#9bd77a;--g3:#2d5a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;font:var(--fs-s)/1.7 "Press Start 2P",ui-monospace,monospace;color:#fff;background:repeating-conic-gradient(#7b5230 0 25%,#6d472a 0 50%) 0 0/48px 48px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.hero{padding:26px 16px 22px;text-align:center;background:var(--g1);border-bottom:8px solid #3d2a17;box-shadow:inset 0 8px 0 var(--g2),inset 0 -8px 0 var(--g3);margin-bottom:20px}
.hero h1{margin:0;display:flex;align-items:center;justify-content:center;gap:14px;font:400 24px/1.2 "Press Start 2P",monospace;text-shadow:3px 3px 0 #1f3a10}
.cake{flex:none;filter:drop-shadow(3px 3px 0 #1f3a10)}
.hero p{margin:12px 0 0;font-size:var(--fs-s);line-height:1.8;text-shadow:calc(var(--fs-s)/8) calc(var(--fs-s)/8) 0 #1f3a10}
.hero p:empty{display:none}
main{max-width:600px;margin:0 auto;padding:0 10px 40px}
.panel{background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:0 0 0 4px #000;padding:8px}
.item{background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;padding:8px;margin-bottom:10px}
.item:last-child{margin-bottom:0}
.name{font-size:var(--fs-n);line-height:1.6;text-shadow:calc(var(--fs-n)/8) calc(var(--fs-n)/8) 0 #3f3f3f;margin-bottom:8px;overflow-wrap:anywhere}
.ic{display:inline-block;width:28px}
.who{font-size:var(--fs-s);line-height:1.7;margin:-2px 0 8px;padding:4px 8px;background:rgba(0,0,0,.35)}
.who.mine{color:#9bd77a}.who.other{color:#ffd45e}
.row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr) minmax(0,.85fr);gap:6px}
.row.own{grid-template-columns:repeat(2,minmax(0,1fr))}
.mc{font:inherit;font-size:var(--fs-b);line-height:1.3;color:#fff;text-shadow:calc(var(--fs-b)/8) calc(var(--fs-b)/8) 0 #3f3f3f;text-decoration:none;text-align:center;min-height:36px;padding:3px 2px;background:#7d7d7d;border:3px solid;border-color:#d0d0d0 #3a3a3a #3a3a3a #d0d0d0;box-shadow:0 0 0 2px #000;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0;overflow-wrap:break-word;hyphens:none}
.mc:active:not(:disabled){border-color:#3a3a3a #d0d0d0 #d0d0d0 #3a3a3a}
.mc.grn{background:var(--g1);border-color:var(--g2) var(--g3) var(--g3) var(--g2)}
.mc.red{background:#b0443a;border-color:#e58b82 #6a1f19 #6a1f19 #e58b82}
.mc:disabled{background:#4a4a4a;color:#a5a5a5;text-shadow:none;cursor:default;border-color:#666 #2b2b2b #2b2b2b #666}
.free{grid-column:span 2;min-height:36px;display:flex;align-items:center;justify-content:center;background:#555;border:3px solid;border-color:#2b2b2b #8b8b8b #8b8b8b #2b2b2b;color:#ffd45e;font-size:var(--fs-s);line-height:1.6;text-shadow:calc(var(--fs-s)/8) calc(var(--fs-s)/8) 0 #1a1a1a;text-align:center}
.note{margin:0 4px 16px;padding:9px 11px;background:rgba(0,0,0,.65);font-size:var(--fs-s);line-height:1.8;box-shadow:0 0 0 2px #000}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);background:#100010;border:3px solid #2d0a63;color:#fff;padding:10px 14px;font-size:var(--fs-s);line-height:1.6;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="hero"><h1><svg class="cake" viewBox="0 0 16 12" width="48" height="36" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="0" width="8" height="1" fill="#2b1b12"/><rect x="2" y="1" width="2" height="1" fill="#2b1b12"/><rect x="4" y="1" width="8" height="1" fill="#f7f3ea"/><rect x="12" y="1" width="2" height="1" fill="#2b1b12"/><rect x="1" y="2" width="1" height="1" fill="#2b1b12"/><rect x="2" y="2" width="2" height="1" fill="#f7f3ea"/><rect x="4" y="2" width="1" height="1" fill="#d3342b"/><rect x="5" y="2" width="6" height="1" fill="#f7f3ea"/><rect x="11" y="2" width="1" height="1" fill="#d3342b"/><rect x="12" y="2" width="3" height="1" fill="#f7f3ea"/><rect x="15" y="2" width="1" height="1" fill="#2b1b12"/><rect x="0" y="3" width="1" height="1" fill="#2b1b12"/><rect x="1" y="3" width="14" height="1" fill="#f7f3ea"/><rect x="15" y="3" width="1" height="1" fill="#2b1b12"/><rect x="0" y="4" width="1" height="1" fill="#2b1b12"/><rect x="1" y="4" width="14" height="1" fill="#ddd6c6"/><rect x="15" y="4" width="1" height="1" fill="#2b1b12"/><rect x="0" y="5" width="1" height="1" fill="#2b1b12"/><rect x="1" y="5" width="14" height="1" fill="#d3342b"/><rect x="15" y="5" width="1" height="1" fill="#2b1b12"/><rect x="0" y="6" width="1" height="1" fill="#2b1b12"/><rect x="1" y="6" width="1" height="1" fill="#d3342b"/><rect x="2" y="6" width="1" height="1" fill="#9c1f1a"/><rect x="3" y="6" width="3" height="1" fill="#d3342b"/><rect x="6" y="6" width="1" height="1" fill="#9c1f1a"/><rect x="7" y="6" width="4" height="1" fill="#d3342b"/><rect x="11" y="6" width="1" height="1" fill="#9c1f1a"/><rect x="12" y="6" width="3" height="1" fill="#d3342b"/><rect x="15" y="6" width="1" height="1" fill="#2b1b12"/><rect x="0" y="7" width="1" height="1" fill="#2b1b12"/><rect x="1" y="7" width="14" height="1" fill="#e0aa63"/><rect x="15" y="7" width="1" height="1" fill="#2b1b12"/><rect x="0" y="8" width="1" height="1" fill="#2b1b12"/><rect x="1" y="8" width="1" height="1" fill="#e0aa63"/><rect x="2" y="8" width="1" height="1" fill="#b98340"/><rect x="3" y="8" width="4" height="1" fill="#e0aa63"/><rect x="7" y="8" width="1" height="1" fill="#b98340"/><rect x="8" y="8" width="4" height="1" fill="#e0aa63"/><rect x="12" y="8" width="1" height="1" fill="#b98340"/><rect x="13" y="8" width="2" height="1" fill="#e0aa63"/><rect x="15" y="8" width="1" height="1" fill="#2b1b12"/><rect x="0" y="9" width="1" height="1" fill="#2b1b12"/><rect x="1" y="9" width="14" height="1" fill="#e0aa63"/><rect x="15" y="9" width="1" height="1" fill="#2b1b12"/><rect x="0" y="10" width="1" height="1" fill="#2b1b12"/><rect x="1" y="10" width="14" height="1" fill="#b98340"/><rect x="15" y="10" width="1" height="1" fill="#2b1b12"/><rect x="1" y="11" width="14" height="1" fill="#2b1b12"/></svg><span>ВИШЛИСТ</span></h1><p id="hint"></p></div>
<main>
  <div class="note" id="note" hidden></div>
  <div class="panel"><div id="list"></div></div>
</main>
<div class="toast" id="toast"></div>
<script>
/* ===== НАСТРОЙКИ: те же значения, что в приложении для графика ===== */
var SUPABASE_URL = "https://gxktfvfbkxotgzwmjjhk.supabase.co";
var SUPABASE_KEY = "sb_publishable_VUWEybbs-Od3mEGjeI5miw_kkAxF3w5";
var OWNER_ID = "77289165";   // ваш Telegram id: брони от вас скрыты
/* ================================================================== */
var ITEMS = [
  { id: "baltika", name: "Балтика 0% малина (ящик)", url: "https://www.ozon.ru/product/pivo-bezalkogolnoe-baltika-0-malina-24-sht-h-0-33-l-fruktovyy-napitok-s-sokom-maliny-3136487062/" },
  { id: "polka", name: "Книжная полка антистресс", url: "https://www.ozon.ru/product/shake-away-your-anxiety-kreativnye-antistressovye-ukrasheniya-dlya-knizhnyh-polok-podarki-na-1671703909/" },
  { id: "chai", name: "Крутой чай", url: "" },
  { id: "bedding", name: "Постельное бельё", url: "https://www.ozon.ru/product/blakit-postelnoe-bele-2-spalnoe-byaz-100-hlopok-2-navolochki-50h70-3239260448/" },
  { id: "handlebar", name: "Руль для велосипеда", url: "https://www.ozon.ru/product/uno-sverhlegkiy-izognutyy-rul-dlya-shosseynogo-serebro-velosipeda-25-4-31-8-mm-360-mm-380-mm-400-1614660947/" },
  { id: "room-atelier", name: "Румбокс «Ателье»", url: "https://www.ozon.ru/product/bez-kleya-rolife-rumboks-atele-elzy-podarochnyy-interernyy-konstruktor-3184214499/" },
  { id: "room-library", name: "Румбокс «Библиотека»", url: "https://www.ozon.ru/product/rumboks-interernyy-konstruktor-seriya-knizhnyy-rumboks-biblioteka-pc2215-801424028/" },
  { id: "chest", name: "Сундук «Майнкрафт»", url: "https://www.ozon.ru/product/sunduk-dlya-hraneniya-igrushek-i-veshchey-maynkraft-1574868894/" }
];
(function(){ var d = window.devicePixelRatio || 1, r = document.documentElement.style;
  function f(max, min){ var n = Math.max(1, Math.floor(max * d / 8)); if(min) n = Math.max(n, Math.ceil(min * d / 8)); return (n * 8 / d).toFixed(3) + "px"; }
  r.setProperty("--fs-b", f(10.8)); r.setProperty("--fs-s", f(12)); r.setProperty("--fs-n", f(14, 12)); })();
var tg = window.Telegram && window.Telegram.WebApp;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
var $ = function(i){ return document.getElementById(i); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var tu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
var me = tu ? String(tu.id) : (function(){ try{ var r = localStorage.getItem("gid") || ("web" + Math.random().toString(36).slice(2)); localStorage.setItem("gid", r); return r; }catch(e){ return "web1"; } })();
var isOwner = me === OWNER_ID, res = {}, toastT;

function toast(t){ var e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ e.classList.remove("show"); }, 2200); }
function api(path, opt){
  opt = opt || {};
  return fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: opt.method || "GET",
    headers: Object.assign({ apikey: SUPABASE_KEY, "Content-Type": "application/json" }, SUPABASE_KEY.indexOf("eyJ") === 0 ? { Authorization: "Bearer " + SUPABASE_KEY } : {}, opt.headers || {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  }).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t.slice(0, 160)); }); return r.status === 204 ? null : r.text().then(function(t){ return t ? JSON.parse(t) : null; }); });
}
function myName(){
  if(tu) return tu.first_name + (tu.last_name ? " " + tu.last_name.charAt(0) + "." : "");
  var n = ""; try{ n = localStorage.getItem("nm") || ""; }catch(e){}
  if(!n){ n = (prompt("Как вас подписать?") || "").trim(); try{ localStorage.setItem("nm", n); }catch(e){} }
  return n;
}

function render(){
  var box = $("list"); box.innerHTML = "";
  ITEMS.forEach(function(it){
    var r = res[it.id], d = document.createElement("div"); d.className = "item";
    var h = '<div class="name">' + esc(it.name) + '</div>';
    if(!isOwner && r) h += '<div class="who ' + (r.tg_id === me ? "mine" : "other") + '">' + (r.tg_id === me ? "Вы забронировали" : "Забронировано" + '</div>';
    h += '<div class="row' + (isOwner ? " own" : "") + '">';
    if(it.url) h += '<a class="mc" href="' + esc(it.url) + '" target="_blank" rel="noopener" data-open="' + esc(it.url) + '">Открыть</a><button class="mc" data-copy="' + esc(it.url) + '">Копировать ссылку</button>';
    else h += '<div class="free">на свой вкус</div>';
    if(!isOwner){
      if(!r) h += '<button class="mc grn" data-res="' + it.id + '">Бронь</button>';
      else if(r.tg_id === me) h += '<button class="mc red" data-unres="' + it.id + '">Снять бронь</button>';
      else h += '<button class="mc" disabled>Занято</button>';
    }
    h += '</div>'; d.innerHTML = h; box.appendChild(d);
  });
}
function load(){
  if(isOwner) return Promise.resolve();
  return api("reservations?select=item_id,tg_id,name").then(function(rows){
    res = {}; (rows || []).forEach(function(x){ res[x.item_id] = x; }); render();
  }).catch(function(e){ $("note").hidden = false; $("note").textContent = "Нет связи с базой: " + (e && e.message || e); });
}

$("list").addEventListener("click", function(e){
  var b = e.target.closest("[data-res],[data-unres],[data-copy],[data-open]"); if(!b) return;
  if(b.dataset.open){ if(tg && tg.initData && tg.openLink){ e.preventDefault(); tg.openLink(b.dataset.open); } return; }
  if(b.dataset.copy){
    try{ navigator.clipboard.writeText(b.dataset.copy).then(function(){ toast("Ссылка скопирована"); }, function(){ toast("Не получилось скопировать"); }); }catch(x){ toast("Не получилось скопировать"); }
    return;
  }
  if(b.dataset.res){
    var name = myName(); if(!name) return;
    b.disabled = true;
    api("reservations?on_conflict=item_id", { method: "POST", headers: { Prefer: "resolution=ignore-duplicates,return=minimal" }, body: { item_id: b.dataset.res, tg_id: me, name: name } })
    .then(load).then(function(){ var r = res[b.dataset.res]; toast(r && r.tg_id === me ? "Забронировано ✓" : "Уже забронировал(а) " + (r ? r.name : "другой человек")); if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); })
    .catch(function(x){ toast("Ошибка: " + (x && x.message || x)); b.disabled = false; });
  }
  if(b.dataset.unres){
    b.disabled = true;
    api("reservations?item_id=eq." + encodeURIComponent(b.dataset.unres) + "&tg_id=eq." + encodeURIComponent(me), { method: "DELETE", headers: { Prefer: "return=minimal" } })
    .then(load).then(function(){ toast("Бронь снята"); })
    .catch(function(x){ toast("Ошибка: " + (x && x.message || x)); b.disabled = false; });
  }
});

if(isOwner){ $("note").hidden = false; $("note").textContent = "Брони скрыты от тебя, чтобы подарки остались сюрпризом 🎁"; }
$("hint").textContent = isOwner ? "" : "Нажми «Бронь», и остальные увидят, что подарок занят";
render(); load();
if(!isOwner){ setInterval(load, 20000); document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(); }); }
</script>
</body>
</html>
